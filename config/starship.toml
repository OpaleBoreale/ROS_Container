# Palette (coolors.co 993955-ffd166-080357-1b998b-f8f1ff)
#   wine   #993955   yellow #FFD166   navy  #080357
#   teal   #1B998B   white  #F8F1FF
# Separator glyphs need a Nerd Font in your terminal.

format = """
[](fg:#993955)\
$hostname\
[](bg:#FFD166 fg:#993955)\
$directory\
[](bg:#1B998B fg:#FFD166)\
$git_branch\
$git_status\
[](bg:#080357 fg:#1B998B)\
$rust\
$c\
$python\
$conda\
[](bg:#2E3440 fg:#080357)\
$memory_usage\
[](bg:#191D24 fg:#2E3440)\
$cmd_duration\
[ ](fg:#191D24)\
$line_break\
$character"""

[username]
disabled = true

[hostname]
ssh_only = false
format = '[ $hostname ]($style)'
style = "bg:#993955 fg:#F8F1FF bold"
trim_at = "."

[directory]
truncation_length = 3
truncate_to_repo = true
format = "[ $path ]($style)"
style = "bg:#FFD166 fg:#080357 bold"
read_only = " [RO]"
read_only_style = "bg:#FFD166 fg:#080357"
home_symbol = "~"

[directory.substitutions]
"Documents" = "docs"
"Downloads" = "dwl"
"Pictures" = "pics"
"Desktop" = "desk"

[git_branch]
format = '[ git:$branch ]($style)'
symbol = ""
style = "bg:#1B998B fg:#F8F1FF bold"
truncation_length = 25

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = "bg:#1B998B fg:#080357 bold"
conflicted = "! "
ahead = "+${count} "
behind = "-${count} "
diverged = "+${ahead_count}-${behind_count} "
untracked = "? "
stashed = "$ "
modified = "* "
staged = "+ "
renamed = "> "
deleted = "x "

[c]
format = '[ C/C++ ]($style)'
symbol = ""
style = "bg:#080357 fg:#F8F1FF bold"
detect_extensions = ["c", "h", "cpp", "cc", "cxx", "hpp", "hh", "hxx"]
detect_files = ["Makefile", "CMakeLists.txt"]

[rust]
format = '[ Rust ]($style)'
symbol = ""
style = "bg:#080357 fg:#E17055 bold"
detect_files = ["Cargo.toml"]

[python]
format = '[ ${symbol}Python (\($virtualenv\) )]($style)'
symbol = ""
style = "bg:#080357 fg:#1B998B bold"
pyenv_version_name = true
detect_extensions = ["py"]
detect_files = ["requirements.txt", "Pipfile", "pyproject.toml"]

[conda]
format = '[ $symbol$environment ]($style)'
symbol = ""
style = "bg:#080357 fg:#1B998B bold"
ignore_base = false

[memory_usage]
disabled = false
threshold = 50
format = '[ mem:$ram_pct ]($style)'
style = "bg:#2E3440 fg:#88C0D0"

[cmd_duration]
min_time = 2_000
format = '[ took:$duration ]($style)'
style = "bg:#191D24 fg:#EBCB8B"
show_milliseconds = false

[character]
success_symbol = "[>](fg:#A3BE8C)"
error_symbol = "[>](fg:#BF616A)"
vicmd_symbol = "[<](fg:#B48EAD)"

[line_break]
disabled = false

# Modules additionnels pour plus de couleur

[time]
disabled = false

[battery]
disabled = false

[jobs]
disabled = false

[status]
disabled = false

# Désactivé pour la performance
[package]
disabled = true

[nodejs]
disabled = true

[docker_context]
disabled = true
