services:
  # ROS 2 Jazzy + TurtleBot3 + Gazebo, desktop in the browser (Apple Silicon)
  ros:
    build:
      context: .
      dockerfile: docker/jazzy.Dockerfile
    platform: linux/arm64
    image: ros2-jazzy-arm64
    container_name: ros2
    hostname: jazzy                  # shown by Starship
    init: true
    ports:
      - "127.0.0.1:6080:6080"        # noVNC desktop: http://localhost:6080/vnc.html
    volumes:
      - ./ros2_ws/src:/ros2_ws/src   # your packages live on the Mac
      - ./maps:/root/maps            # maps saved by map_saver
      - ./share:/root/share          # files to exchange with the Mac: rosbags, TF PDFs,
                                     # screenshots, share/wallpaper.jpg (desktop background)
      - ros2_build:/ros2_ws/build    # build artifacts survive restarts
      - ros2_install:/ros2_ws/install
      - ros2_log:/ros2_ws/log
      - gz_cache:/root/.gz           # Gazebo models downloaded from Fuel
      - zsh_history:/root/.zsh_hist
    shm_size: "2gb"                  # Gazebo + DDS shared memory
    environment:
      HISTFILE: /root/.zsh_hist/history
      ROS_DOMAIN_ID: 0
      TURTLEBOT3_MODEL: burger
      VNC_GEOMETRY: ${VNC_GEOMETRY:-1600x900}

volumes:
  ros2_build:
  ros2_install:
  ros2_log:
  gz_cache:
  zsh_history:
